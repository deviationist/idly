<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#dedbd6}a{color:#1d1c1a}a:hover{color:#64605a}</style></helmet>
<div style="padding:56px;display:flex;flex-direction:column;gap:48px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1d1c1a">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:28px;font-weight:600">Idly — popup and icon</div>
    <div style="font-size:14px;color:#64605a">Every state, light and dark. Source of truth: popup.html and icons/*.svg.</div>
  </div>

  <section data-screen-label="Icon options" style="display:flex;flex-direction:column;gap:16px">
    <div style="font-size:18px;font-weight:600">Icon options: colour</div>
    <div style="display:flex;flex-wrap:wrap;gap:24px">
      <sc-for list="{{ iconOpts }}" as="o" hint-placeholder-count="3">
        <div id="{{ o.id }}" style="display:flex;flex-direction:column;gap:16px;padding:24px;background:#fbfaf8;border-radius:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="font:600 12px ui-monospace,Menlo,monospace;padding:3px 7px;border-radius:5px;background:#1d1c1a;color:#fbfaf8">{{ o.id }}</div>
            <div style="font-size:14px;font-weight:600">{{ o.name }}</div>
          </div>
          <div style="display:flex;gap:20px;align-items:flex-end">
            <img src="{{ o.i128 }}" style="width:128px;height:128px;display:block">
            <img src="{{ o.i48 }}" style="width:48px;height:48px;display:block">
            <img src="{{ o.i32 }}" style="width:32px;height:32px;display:block">
            <img src="{{ o.i16 }}" style="width:16px;height:16px;display:block">
          </div>
          <div style="display:flex;gap:12px">
            <div style="display:flex;gap:26px;align-items:center;padding:20px 24px;background:#f1f3f4;border-radius:10px">
              <img src="{{ o.i16 }}" style="width:48px;height:48px;display:block">
              <div style="position:relative;width:48px;height:48px"><img src="{{ o.i16 }}" style="width:48px;height:48px;display:block"><div style="position:absolute;right:-9px;bottom:-6px;height:27px;padding:0 6px;border-radius:6px;background:#1f8a4c;color:#fff;font:600 21px/27px system-ui,sans-serif">ON</div></div>
            </div>
            <div style="display:flex;gap:26px;align-items:center;padding:20px 24px;background:#35363a;border-radius:10px">
              <img src="{{ o.i16 }}" style="width:48px;height:48px;display:block">
              <div style="position:relative;width:48px;height:48px"><img src="{{ o.i16 }}" style="width:48px;height:48px;display:block"><div style="position:absolute;right:-9px;bottom:-6px;height:27px;padding:0 6px;border-radius:6px;background:#1f8a4c;color:#fff;font:600 21px/27px system-ui,sans-serif">ON</div></div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Icon" style="display:flex;gap:40px;flex-wrap:wrap;align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:14px;padding:28px;background:#fbfaf8;border-radius:12px">
      <div style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#64605a">Icon sizes</div>
      <div style="display:flex;gap:28px;align-items:flex-end">
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../icons/svg/mono-16.svg" style="width:16px;height:16px;display:block"><div style="font:11px ui-monospace,Menlo,monospace;color:#64605a">16</div></div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../icons/svg/mono-32.svg" style="width:32px;height:32px;display:block"><div style="font:11px ui-monospace,Menlo,monospace;color:#64605a">32</div></div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../icons/svg/mono-48.svg" style="width:48px;height:48px;display:block"><div style="font:11px ui-monospace,Menlo,monospace;color:#64605a">48</div></div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../icons/svg/mono-128.svg" style="width:128px;height:128px;display:block"><div style="font:11px ui-monospace,Menlo,monospace;color:#64605a">128</div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;padding:28px;background:#fbfaf8;border-radius:12px">
      <div style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#64605a">Toolbar, with ON badge (shown 3×)</div>
      <div style="display:flex;gap:20px">
        <div style="display:flex;gap:30px;align-items:center;padding:24px 30px;background:#f1f3f4;border-radius:10px">
          <img src="../icons/svg/mono-16.svg" style="width:48px;height:48px;display:block">
          <div style="position:relative;width:48px;height:48px"><img src="../icons/svg/mono-16.svg" style="width:48px;height:48px;display:block"><div style="position:absolute;right:-9px;bottom:-6px;height:27px;padding:0 6px;border-radius:6px;background:#1f8a4c;color:#fff;font:600 21px/27px system-ui,sans-serif">ON</div></div>
        </div>
        <div style="display:flex;gap:30px;align-items:center;padding:24px 30px;background:#35363a;border-radius:10px">
          <img src="../icons/svg/mono-16.svg" style="width:48px;height:48px;display:block">
          <div style="position:relative;width:48px;height:48px"><img src="../icons/svg/mono-16.svg" style="width:48px;height:48px;display:block"><div style="position:absolute;right:-9px;bottom:-6px;height:27px;padding:0 6px;border-radius:6px;background:#1f8a4c;color:#fff;font:600 21px/27px system-ui,sans-serif">ON</div></div>
        </div>
      </div>
    </div>
  </section>

  <section data-screen-label="Light" style="display:flex;flex-direction:column;gap:20px;--bg:#fbfaf8;--surface:#f2f0ec;--field:#ffffff;--fg:#1d1c1a;--muted:#64605a;--border:#e3e0da;--border-strong:#cdc9c1;--hover:#ebe8e3;--ink:#1d1c1a;--ink-hover:#34322f;--on-ink:#fbfaf8;--on:#1b7340;--dot:#1f8a4c;--err:#b3261e;--focus:#3a6fd8;--frame:rgba(0,0,0,.08)">
    <div style="font-size:18px;font-weight:600">Light</div>
    <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
      <sc-for list="{{ mocks }}" as="m" hint-placeholder-count="13">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font:12px ui-monospace,Menlo,monospace;color:#64605a">{{ m.label }}</div>
          <dc-import name="PopupMock" host="{{ m.host }}" status="{{ m.status }}" on="{{ m.on }}" btn="{{ m.btn }}" primary="{{ m.primary }}" unsupported="{{ m.unsupported }}" sites="{{ m.sites }}" error="{{ m.error }}" draft="{{ m.draft }}" sub="{{ m.sub }}" notice="{{ m.notice }}" hint-size="340px,480px"></dc-import>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Dark" style="display:flex;flex-direction:column;gap:20px;margin:0 -56px -56px;padding:48px 56px 56px;background:#111214;--bg:#1b1c1e;--surface:#232427;--field:#17181a;--fg:#ecebe8;--muted:#a3a19c;--border:#313235;--border-strong:#47494d;--hover:#2c2d31;--ink:#ecebe8;--ink-hover:#ffffff;--on-ink:#1b1c1e;--on:#62c98e;--dot:#3fbf74;--err:#f08a80;--focus:#7aa5ff;--frame:rgba(255,255,255,.08)">
    <div style="font-size:18px;font-weight:600;color:#ecebe8">Dark</div>
    <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
      <sc-for list="{{ mocks }}" as="m" hint-placeholder-count="13">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font:12px ui-monospace,Menlo,monospace;color:#a3a19c">{{ m.label }}</div>
          <dc-import name="PopupMock" host="{{ m.host }}" status="{{ m.status }}" on="{{ m.on }}" btn="{{ m.btn }}" primary="{{ m.primary }}" unsupported="{{ m.unsupported }}" sites="{{ m.sites }}" error="{{ m.error }}" draft="{{ m.draft }}" sub="{{ m.sub }}" notice="{{ m.notice }}" hint-size="340px,480px"></dc-import>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const base = ['*.example.com', 'bank.example.org', '*.mail.example.net'];
    const long = ['secure.online-banking.example.co.uk', 'example.com', 'bank.example.org', 'mail.example.net', 'portal.insurer.example', 'payroll.example-hr.com', 'tax.gov.example', 'pension.example.org', 'broker.example.io', 'my.utility.example', 'health.example.net', 'energy.example.co.uk', 'crm.example.app', 'docs.example.com', 'lib.example.edu', 'intranet.example.local', 'card.example.bank', 'savings.example.org', 'phone.example.com', 'school.example.edu', 'council.example.gov.uk', 'mortgage.example.com'];
    const off = { status: 'Not active', on: false, btn: 'Keep me logged in', primary: true };
    const mocks = [
      { label: '01 · Not active', host: 'netbank.example.com', ...off, sites: base },
      { label: '02 · Active on this website', host: 'netbank.example.com', status: 'Staying logged in', on: true, btn: 'Stop keeping me logged in', sites: ['netbank.example.com', ...base.slice(1)] },
      { label: '03 · Active via parent (*.example.com)', host: 'netbank.example.com', status: 'Staying logged in (via *.example.com)', on: true, btn: 'Stop for all of example.com', sites: base },
      { label: '04 · Unsupported page', host: "Idly can't run on this page.", status: '', unsupported: true, sites: base },
      { label: '05 · Empty list', host: 'netbank.example.com', ...off, sites: [] },
      { label: '06 · Add error: invalid', host: 'netbank.example.com', ...off, sites: base, draft: 'netbank', error: "That doesn't look like a website address." },
      { label: '07 · Typing, include subdomains on', host: 'netbank.example.com', ...off, sites: base, draft: 'bank.com', sub: true },
      { label: '08 · Typing, exact website only', host: 'netbank.example.com', ...off, sites: base, draft: 'bank.com', sub: false },
      { label: '09 · Pasted https://www.bank.com/login?x=1 → cleaned', host: 'netbank.example.com', ...off, sites: base, draft: 'www.bank.com', sub: true },
      { label: '10 · Duplicate: exact entry already listed', host: 'netbank.example.com', ...off, sites: base, draft: 'bank.example.org', sub: false, error: 'Already in the list.' },
      { label: '11 · Duplicate: covered by a wildcard', host: 'netbank.example.com', ...off, sites: base, draft: 'mail.example.net', sub: false, error: 'Already covered by *.mail.example.net.' },
      { label: '12 · Wildcard replaced the exact entry', host: 'netbank.example.com', ...off, sites: ['*.example.com', '*.bank.example.org', '*.mail.example.net'], notice: 'Replaced bank.example.org with *.bank.example.org.' },
      { label: '13 · Long hostname, 22 websites (scrolls)', host: 'secure.online-banking.example.co.uk', status: 'Staying logged in', on: true, btn: 'Stop keeping me logged in', sites: long }
    ];
    const io = (id, k, name) => ({ id, name, i16: `../icons/svg/${k}-16.svg`, i32: `../icons/svg/${k}-32.svg`, i48: `../icons/svg/${k}-48.svg`, i128: `../icons/svg/${k}-128.svg` });
    const iconOpts = [io('2a', 'a', 'Slate tile, green pupil'), io('2b', 'b', 'Deep green tile'), io('2c', 'c', 'Pale green tile, green eye')];
    return { mocks, iconOpts };
  }
}
</script>
</body>
</html>
