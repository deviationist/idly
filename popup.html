<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idly</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --surface: #f2f0ec;
  --field: #ffffff;
  --fg: #1d1c1a;
  --muted: #64605a;
  --placeholder: #75716a; /* design: #8a867f, darkened for 4.5:1 */
  --border: #e3e0da;
  --border-strong: #cdc9c1;
  --hover: #ebe8e3;
  --ink: #1d1c1a;
  --ink-hover: #34322f;
  --on-ink: #fbfaf8;
  --on: #1b7340;
  --dot: #1f8a4c;
  --err: #b3261e;
  --focus: #3a6fd8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1c1e;
    --surface: #232427;
    --field: #17181a;
    --fg: #ecebe8;
    --muted: #a3a19c;
    --placeholder: #858380; /* design: #7f7d79, lightened for 4.5:1 */
    --border: #313235;
    --border-strong: #47494d;
    --hover: #2c2d31;
    --ink: #ecebe8;
    --ink-hover: #ffffff;
    --on-ink: #1b1c1e;
    --on: #62c98e;
    --dot: #3fbf74;
    --err: #f08a80;
    --focus: #7aa5ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: 340px;
  max-height: 600px;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px; }
header svg { width: 20px; height: 20px; flex: none; }
/* Icon option b (deep green) in light mode, option c (pale green) in dark,
   matching the toolbar icon that background.js swaps. */
.logo-tile { fill: #14543a; } .logo-eye { stroke: #f4f1ea; } .logo-pupil { fill: #8fe3b0; }
@media (prefers-color-scheme: dark) {
  .logo-tile { fill: #e3f1e8; } .logo-eye { stroke: #1f8a4c; } .logo-pupil { fill: #1f8a4c; }
}
header h1 { margin: 0; font-size: 14px; font-weight: 600; }

.label {
  margin: 0 0 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted);
}

.page {
  margin: 0 12px; padding: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
}
#current-host { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
#current-status {
  display: flex; align-items: center; gap: 7px;
  margin: 4px 0 0; font-size: 12.5px; color: var(--muted);
}
#current-status:empty { display: none; }
#current-status.on { color: var(--on); }
#current-status.on::before {
  content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--dot);
  animation: breathe 2.8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: .4; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1); }
}
#current-btn {
  width: 100%; height: 36px; margin-top: 12px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--bg); font-weight: 500;
}
#current-btn:hover { background: var(--hover); }
#current-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
#current-btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
#current-btn[hidden] { display: none; }

.domains { padding: 18px 16px 0; }
#sites {
  list-style: none; margin: 0; padding: 0;
  max-height: 222px; overflow-y: auto;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
#sites li {
  display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 2px;
  border-bottom: 1px solid var(--border);
}
#sites li:last-child { border-bottom: 0; }
#sites li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sites li button {
  flex: none; padding: 4px 6px; border: 0; border-radius: 5px;
  background: none; color: var(--muted); font-size: 12px;
}
#sites li button:hover { background: var(--hover); color: var(--fg); }
#sites li.muted { color: var(--muted); }
/* Per-site options (added after the design handoff; reuses its tokens). */
#sites li button[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
#sites li .tags { flex: none; font-size: 11px; color: var(--muted); }
#sites li.options { display: block; padding: 4px 2px 12px; }
#sites li.options .check { margin-top: 4px; }
#sites li.options .warn { margin-bottom: 10px; }
.opt-label { display: block; margin: 0 0 4px; font-size: 12px; }
.opt-form { display: flex; align-items: center; gap: 6px; }
.opt-form input {
  flex: 1; min-width: 0; height: 30px; padding: 0 8px;
  border: 1px solid var(--border-strong); border-radius: 7px; background: var(--field); font-size: 12px;
}
.opt-form input::placeholder { color: var(--placeholder); }
#sites li.options .opt-form button {
  height: 30px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 7px;
  background: var(--bg); color: var(--fg); font-size: 12px; font-weight: 500;
}

#add { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.field {
  flex: 1; min-width: 0; display: flex; align-items: center; height: 32px;
  border: 1px solid var(--border-strong); border-radius: 7px; background: var(--field);
}
.field:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.field input {
  flex: 1; min-width: 0; height: 100%; padding: 0 10px;
  border: 0; background: none; outline: none;
}
.field input::placeholder { color: var(--placeholder); }
/* "*." prefix appears while typing with Include subdomains on */
.wild { display: none; padding-left: 10px; color: var(--muted); font: 12.5px ui-monospace, Menlo, monospace; }
.domains:has(#subdomains:checked) .field:has(input:not(:placeholder-shown)) .wild { display: block; }
.domains:has(#subdomains:checked) .field:has(input:not(:placeholder-shown)) input { padding-left: 1px; }
.check { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; cursor: pointer; }
.check input { margin: 0; width: 14px; height: 14px; accent-color: var(--dot); }
.scope-exact { display: none; }
.domains:has(#subdomains:not(:checked)) .scope-all { display: none; }
.domains:has(#subdomains:not(:checked)) .scope-exact { display: block; }
#add button {
  flex: none; height: 32px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: 7px;
  background: var(--bg); font-weight: 500;
}
#add button:hover { background: var(--hover); }
.error { margin: 6px 0 0; font-size: 12px; color: var(--err); }
.error:empty { display: none; }
.notice { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.notice:empty { display: none; }
.hint { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
/* Added after the design handoff: scope option for "Keep me logged in", and the
   footer link to the browser's site-access settings. Both reuse existing tokens. */
[hidden] { display: none !important; }
.page .check { margin-top: 10px; }
#manage {
  padding: 0; border: 0; background: none; color: var(--muted);
  font-size: 12px; text-decoration: underline; text-underline-offset: 2px;
}
#manage:hover { color: var(--fg); }

footer {
  margin-top: 16px; padding: 10px 16px 12px;
  border-top: 1px solid var(--border);
}
footer .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
footer .row + .row { margin-top: 8px; }
footer label { font-size: 12px; color: var(--muted); }
footer .check { margin-top: 0; }
#interval {
  width: 64px; height: 26px; padding: 0 6px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--field); font-size: 12px; text-align: right;
}

@media (prefers-reduced-motion: reduce) {
  #current-status.on::before { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 128 128" aria-hidden="true">
    <rect class="logo-tile" width="128" height="128" rx="28"/>
    <path d="M18 64 Q64 16 110 64 Q64 112 18 64 Z" fill="none" class="logo-eye" stroke-width="9" stroke-linejoin="round"/>
    <circle class="logo-pupil" cx="64" cy="64" r="15"/>
  </svg>
  <h1>Idly</h1>
</header>

<section class="page" aria-labelledby="page-label">
  <p class="label" id="page-label">This page</p>
  <p id="current-host"></p>
  <p id="current-status" role="status"></p>
  <button id="current-btn" type="button" hidden></button>
  <label class="check" id="page-scope" hidden><input id="page-subdomains" type="checkbox"> Include subdomains</label>
  <p class="hint" id="page-hint" hidden></p>
</section>

<section class="domains" aria-labelledby="domains-label">
  <p class="label" id="domains-label">Active websites</p>
  <ul id="sites"></ul>
  <form id="add" autocomplete="off">
    <div class="field">
      <span class="wild" aria-hidden="true">*.</span>
      <input id="domain" name="domain" type="text" placeholder="Add a website, e.g. example.com" aria-label="Website" spellcheck="false" autocapitalize="off">
    </div>
    <button type="submit">Add</button>
  </form>
  <p id="error" class="error" role="alert"></p>
  <p id="notice" class="notice" role="status"></p>
  <label class="check"><input id="subdomains" type="checkbox" checked> Include subdomains</label>
  <p class="hint scope-all">Also covers its subdomains, such as www. and auth.</p>
  <p class="hint scope-exact">Covers only the exact website you type.</p>
</section>

<footer>
  <div class="row">
    <label for="interval">Nudge every (minutes)</label>
    <input id="interval" type="number" min="0.5" step="0.5" value="1">
  </div>
  <div class="row">
    <button id="manage" type="button">Manage site access</button>
    <label class="check" title="Log each nudge to the page's Console and a timeline to the service worker's Console"><input id="debug" type="checkbox"> Debug logging</label>
  </div>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
